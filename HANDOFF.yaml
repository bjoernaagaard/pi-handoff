established_facts:
  # Each fact was read in source on 2026-11-06. "PI/" and "CORE/" refer to source_roots.
  F1:
    {
      fact: "agent_settled fires after retries, compaction and queued continuations finish. isStreaming is already false then.",
      source: "PI/dist/core/agent-session.js:696-718, 1081-1083",
    }
  F2:
    {
      fact: "prompt() and sendCustomMessage(triggerTurn) called while agent_settled handlers run are deferred until every settled handler returns.",
      source: "PI/dist/core/agent-session.js:1650-1651, 1883-1888, 708-716",
    }
  F3:
    {
      fact: 'pi.sendUserMessage("/cmd args", { expandPromptTemplates: true }) runs a registered extension command with an ExtensionCommandContext. Pi docs show this pattern for running a command from agent_settled.',
      source: "PI/dist/core/agent-session.js:1654-1660, 1716-1726; PI/docs/extensions.md:1536-1561",
    }
  F4:
    {
      fact: "ctx.navigateTree and ctx.waitForIdle exist only on the command context, not on event or tool contexts.",
      source: "PI/dist/core/extensions/types.d.ts:305-341; PI/dist/core/extensions/runner.js:724-760",
    }
  F5:
    {
      fact: "navigateTree throws while a run or a compaction or another navigation is active. It returns { cancelled: false } and does nothing if the target is already the leaf.",
      source: "PI/dist/core/agent-session.js:3280-3290; PI/docs/extensions.md:1407-1410",
    }
  F6:
    {
      fact: "Navigating to a plain custom entry makes that entry the leaf. Navigating to a user message or custom_message makes its parent the leaf.",
      source: "PI/dist/core/agent-session.js:3385-3396",
    }
  F7:
    {
      fact: "navigateTree with summarize:false and no label writes nothing to the session file. Only leafId changes in memory. A label option appends a label entry.",
      source: "PI/dist/core/agent-session.js:3401-3420; PI/dist/core/session-manager.js:1173-1178",
    }
  F8:
    {
      fact: "After navigation Pi rebuilds model messages, restores tools from the transcript and emits session_tree { newLeafId, oldLeafId }. The extension instance is the same object.",
      source: "PI/dist/core/agent-session.js:3422-3431",
    }
  F9:
    {
      fact: "session_before_tree can return { cancel: true } and receives preparation.oldLeafId.",
      source: "PI/dist/core/agent-session.js:3301-3329; PI/dist/core/extensions/types.d.ts:663-690",
    }
  F10:
    {
      fact: "When Pi loads a session file, the leaf is the last entry in file order.",
      source: "PI/dist/core/session-manager.js:733-742",
    }
  F11:
    {
      fact: "Every appended entry gets the current leaf as parentId and becomes the new leaf.",
      source: "PI/dist/core/session-manager.js:816-830, 913-923",
    }
  F12:
    {
      fact: "Plain custom entries never reach the model. custom_message entries do.",
      source: "PI/dist/core/session-manager.js:162-191",
    }
  F13:
    {
      fact: "pi.appendEntry writes immediately, even during a run. Custom messages sent during a run without triggerTurn wait until the turn ends.",
      source: "PI/dist/core/agent-session.js:2801-2807, 1890-1896",
    }
  F14:
    {
      fact: "A triggerTurn custom message is written to the session at message_end before the first provider request. The compaction check and before_agent_start run before that write.",
      source: "PI/dist/core/agent-session.js:1497-1504, 770-775; CORE/dist/agent-loop.js:55-61",
    }
  F15:
    {
      fact: "Pi diffs the system prompt against system messages on the current branch and records a new system message on the next run when they differ. An anchor placed before any system message still gets a full system prompt after navigation.",
      source: "PI/dist/core/agent-session.js:1341-1346, 1543-1546",
    }
  F16:
    {
      fact: "Extension ctx.sessionManager exposes getEntries, getEntry, getBranch(fromId), getTree, getLeafId, getLeafEntry, getHeader, getSessionFile, getSessionId, buildSessionProjection. It does not expose getChildren or branch().",
      source: "PI/dist/core/session-manager.d.ts:178",
    }
  F17:
    {
      fact: "getEntries() returns every entry on every branch, including entries hidden from the model by compaction. getBranch(fromId) follows raw parentId links.",
      source: "PI/dist/core/session-manager.js:1074-1084, 1119-1121",
    }
  F18:
    {
      fact: "getTree() orders siblings by timestamp only.",
      source: "PI/dist/core/session-manager.js:1159",
    }
  F19:
    {
      fact: "Compaction keeps a summary plus a recent tail of the active path. The summary covers everything before the tail, including entries before the anchor.",
      source: "PI/dist/core/session-manager.js:201-229; PI/dist/core/compaction/compaction.js:609-636",
    }
  F20:
    {
      fact: "compaction.enabled defaults to true. Setting it false disables threshold and overflow compaction.",
      source: "PI/dist/core/agent-session.js:2409-2412; PI/docs/settings.md:73-75",
    }
  F21:
    {
      fact: "session_before_compact can return { cancel: true } and carries reason manual|threshold|overflow and willRetry.",
      source: "PI/dist/core/extensions/types.d.ts:620-630; PI/docs/extensions.md:532-546",
    }
  F22:
    {
      fact: "In the TUI, text submitted while navigateTree runs (isCompacting is true) is queued and sent right after navigateTree returns, before the command handler continues.",
      source: "PI/dist/core/agent-session.js:1242-1246; PI/dist/modes/interactive/interactive-mode.js:2758-2766, 1593-1609, 3996-4046",
    }
  F23:
    {
      fact: "The session file is written with openSync/appendFileSync and no fsync.",
      source: "PI/dist/core/session-manager.js:801, 813",
    }
  F24:
    {
      fact: "A new session file is not written until it holds a user or assistant message. Then the whole in-memory buffer is written.",
      source: "PI/dist/core/session-manager.js:792-815",
    }
  F25:
    {
      fact: "navigateTree only changes session state. It does not undo file edits or outside actions.",
      source: "PI/dist/core/agent-session.js:3279-3433",
    }
  F26:
    {
      fact: "Pi validates tool arguments with @earendil-works/pi-schema, whatever built the schema.",
      source: "PI/docs/extensions.md:174-182; PI/CHANGELOG.md:14",
    }
  F27:
    {
      fact: "Pi maps only pi-ai, pi-agent-core, pi-coding-agent, pi-tui and typebox for extensions. pi-schema is not mapped and must be a real dependency.",
      source: "PI/dist/core/extensions/virtual-modules.js:15-40; PI/docs/packages.md (Declare dependencies)",
    }
  F28:
    {
      fact: "registerTool types parameters as TypeBox TSchema.",
      source: "PI/dist/core/extensions/types.d.ts:472-484, 1252",
    }
  F29:
    {
      fact: "Session files are parsed without validation, so entries can be old, forked or hand-edited.",
      source: "PI/dist/core/session-manager.js:169-170",
    }
  F30:
    fact: "pi-schema 1.5.0 obj() is closed, reports errors as JSON Pointer paths, and a union of lit() values reports only the first literal on failure."
    source: "Probe run with `node probe.ts` (Node 26 runs TypeScript directly) on 2026-11-06"
    recorded_output: |
      true
      [{"path":"/sourceLeafId","keyword":"required","message":"missing"},{"path":"/previousDestinationId","keyword":"required","message":"missing"},{"path":"/version","keyword":"const","message":"expected 1"},{"path":"/handoffId","keyword":"minLength","message":"expected at least 1 characters"},{"path":"/extra","keyword":"additionalProperties","message":"unknown field"}]
      [{"path":"/reason","keyword":"const","message":"expected \"aborted-run\""}]
  F31:
    {
      fact: "A tool result may set terminate: true. Pi docs use it for a tool that hands work to agent_settled.",
      source: "PI/dist/core/extensions/types.d.ts:1116; PI/docs/extensions.md:1540-1553",
    }
  F32:
    {
      fact: "Branch-dependent extension state should be rebuilt from getBranch() on session_start and session_tree.",
      source: "PI/docs/extensions.md:2133-2160",
    }
  F33:
    {
      fact: "pi CLI supports -e/--extension <path>, --session <path|id>, --session-dir <dir>, --no-session, -p/--print, --mode json|rpc. PI_CODING_AGENT_DIR overrides ~/.pi/agent.",
      source: "PI/docs/cli.md:45-48, 86-104, 194; PI/docs/environment-variables.md:81",
    }
  F34:
    {
      fact: "print and rpc modes also wire navigateTree into the command context.",
      source: "PI/dist/modes/print-mode.js:62-70; PI/dist/modes/rpc/rpc-mode.js:240-248",
    }

