handoff:
  version: 1
  written: "2026-11-06"
  for: "An agent implementing the pi-handoff Pi extension. Everything needed is in this file and the paths it names."

goal: >-
  Build a Pi extension that keeps related work in one Pi session file. Each model request carries only a small fixed prefix (root up to an anchor entry) plus the current branch. A handoff archives the current work by moving the session leaf back to the anchor, writes a destination record and a continuation message under the anchor, and resumes work. Archived work stays searchable from the current branch without moving back onto it.

session_shape: |
  root ... anchor (plain custom entry, near the start of the session)
           ├── archived work A
           ├── archived work B
           └── active continuation C   <- current leaf

