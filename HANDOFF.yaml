    - e717fcb Add pi-schema and use it for handoff record validation
    - ae94e36 Replace HANDOFF.md with executable HANDOFF.yaml and draft continuation text
    - (the commit that switches the project to npm)
  package_manager: "npm 11.20.0 on Node 26.13.0. Pi documents npm for extensions (PI/docs/extensions.md:168, 303; PI/docs/settings.md:144; PI/examples/extensions/with-deps/package-lock.json)."
  tooling:
    ultracite: "8.1.1 (npm latest on 2026-11-06)"
    linter: "oxlint 1.92 with ultracite core + anti-slop presets (extends: [core, antiSlop], so anti-slop wins), type-aware via oxlint-tsgolint"
    formatter: oxfmt 0.75
