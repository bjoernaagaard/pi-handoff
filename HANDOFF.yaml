guarantees_not_made:
  - "The handoff is not atomic. It is several separate file appends (F7, F11, F23)."
  - "Pi does not detect duplicate handoffs. Only the extension's reconciler does."
  - "Effects are not exactly-once. Tool effects from archived work stay in place (F25)."
  - "Recall is not complete. Search returns bounded excerpts."
  - "Data can be lost on power failure, because Pi does not fsync (F23)."

