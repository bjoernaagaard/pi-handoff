contracts:
  custom_types:
    anchor: pi-handoff/anchor
    intent: pi-handoff/intent
    destination: pi-handoff/destination
    cancelled: pi-handoff/cancelled
    compaction_allowed: pi-handoff/compaction-allowed
    continuation_message: pi-handoff/continuation
  records_ts: |
    import { arr, compile, lit, nullable, obj, oneOf, type Static, str } from "@earendil-works/pi-schema";

    const Id = str({ minLength: 1 });

    export const AnchorRecord = obj({ version: lit(1), createdAt: str({ format: "date-time" }) });

    const ToolCallNote = obj({
      toolCallId: Id,
      toolName: Id,
      status: oneOf(["completed", "error", "no-result"]),
    });

    // Written on the source branch by the handoff tool or /handoff.
    export const IntentRecord = obj({
      version: lit(1),
      handoffId: Id,
      anchorId: Id,
      sourceSessionFile: Id,
      sourceSessionId: Id,
      task: Id,
      constraints: arr(str()),
      openToolCalls: arr(ToolCallNote),
    });

    // parentId must equal anchorId.
    export const DestinationRecord = obj({
      version: lit(1),
      handoffId: Id,
      intentEntryId: Id,
      sourceLeafId: Id,
      previousDestinationId: nullable(Id),
      sourceSessionFile: Id,
      sourceSessionId: Id,
    });

    export const ContinuationDetails = obj({ handoffId: Id, destinationId: Id });

    export const CancelRecord = obj({
      version: lit(1),
      handoffId: Id,
      reason: oneOf(["aborted-run", "tree-cancelled", "navigate-threw", "leaf-moved", "user"]),
    });

    export const CompactionAllowedRecord = obj({ version: lit(1), reason: oneOf(["overflow", "manual"]) });

    export type IntentRecord = Static<typeof IntentRecord>;
    export const intentRecord = compile(IntentRecord);
    // Same pattern for every record: compile once at module load, check(entry.data) before use,
    // log errors(entry.data) and treat the record as missing when check fails (F29).
  record_rules:
    - "Use oneOf for string enums, never union of lit (F30)."
    - "All records are plain custom entries via pi.appendEntry (F12, F13). Only the continuation is a custom_message."
    - "Order of continuations comes from previousDestinationId and sourceLeafId, never sibling timestamps (F18)."
    - "Exactly one anchor per session."
  handoff_tool:
    name: handoff
    parameters_typebox: "Type.Object({ task: Type.String({ minLength: 1 }), constraints: Type.Array(Type.String()) })"
    effect: "Writes IntentRecord on the current branch, returns text naming the handoffId, sets terminate: true (F31)."
  commands:
    - "/handoff <task>: user-facing. Writes the same IntentRecord with constraints: [] unless the user passes them, then runs the lifecycle when idle."
    - "/handoff resume <handoffId>: user-facing. Continues a stale intent after a crash."
    - "/pi-handoff:run <handoffId>: internal. Dispatched from agent_settled. Runs lifecycle steps 3 to 7."
  handoff_search_tool:
    name: handoff_search
    parameters_typebox: "Type.Object({ query: Type.String({ minLength: 1 }), limit: Type.Optional(Type.Integer({ minimum: 1, maximum: 20 })) })"
    defaults: { limit: 8, max_chars_per_hit: 1200 }
    output_per_hit: "{ sessionFile, sessionId, entryId, timestamp, status: current|archived|abandoned|orphaned, hiddenByCompaction: boolean, handoffId|null, excerpt }"
    algorithm: |
      destinations = valid DestinationRecords, ordered by previousDestinationId
      current = set of ids in getBranch()
      for entry in getEntries():                         # all branches, raw (F17)
        text = text of user, assistant, toolResult and custom_message entries
        skip unless text matches query (case-insensitive substring)
        owner = first destination whose getBranch(sourceLeafId) contains entry
        status = current   if entry in current
                 archived  if owner and entry in getBranch(owner.sourceLeafId)
                 abandoned if under the anchor but off every finalized path
                 orphaned  if under the anchor before any destination
        hiddenByCompaction = entry in current and before the latest compaction's firstKeptEntryId
      return newest `limit` hits, excerpt cut to max_chars_per_hit
  continuation_template:
    status: "APPROVED by the user as written on 2026-11-06 (H1). The model reads this text after every handoff. Do not change it without asking."
    customType: pi-handoff/continuation
    display: true
    details: ContinuationDetails
    content: |
      You are continuing work from an earlier part of this session. That earlier work is archived, not deleted. You cannot see it here, but you can search it with the handoff_search tool.

      Task
      {task}

      Constraints that still apply. They are quoted exactly. Follow every one.
      {constraints as "- " lines, or "- None recorded."}

      Where this came from
      - Session file: {sourceSessionFile}
      - Session ID: {sourceSessionId}
      - Last entry of the archived work: {sourceLeafId}
      - Handoff ID: {handoffId}
      {only when openToolCalls is not empty:}
      Tool calls from the archived work that may not have finished
      {"- {toolName} ({toolCallId}): {status}" lines}
      Check the real state of each one before you run it again.

      Files and outside changes made by the archived work are still in place. Before you rely on an earlier decision, find it with handoff_search and cite its entry ID. Results marked "abandoned" are alternatives that were dropped, not decisions.

lifecycle:
  states: "idle -> intent-written -> navigating -> destination-written -> continuing -> idle; any state before destination-written may go to cancelled"
  steps:
    - "1. The model calls handoff, or the user runs /handoff. An IntentRecord is appended on the source branch."
    - "2. agent_settled handler: if a pending intent exists and event.aborted is true, append CancelRecord(aborted-run) and stop. Otherwise pi.sendUserMessage('/pi-handoff:run <id>', { expandPromptTemplates: true }) (F2, F3)."
    - "3. Command: await ctx.waitForIdle(). sourceLeafId = ctx.sessionManager.getLeafId()."
    - "4. Set an in-memory 'handoff running' flag, then ctx.navigateTree(anchorId, { summarize: false }) with no label (F5-F7)."
    - "5. On cancelled or throw: clear the flag, append CancelRecord(tree-cancelled|navigate-threw) on the source branch, stop."
    - "6. If getLeafId() !== anchorId: append CancelRecord(leaf-moved) and stop without repair. Report it."
    - "7. pi.appendEntry(DestinationRecord) under the anchor. Then pi.sendMessage(continuation, { triggerTurn: true }) (F14). Clear the flag. Replay held input as follow-ups."
    - "8. On session_start and session_tree, rebuild branch-dependent state from getBranch() (F8, F32)."
  anchor_placement: "On session_start with reason startup or new, append an AnchorRecord if none exists. Pi writes it with the first user message (F24). Before any system message is fine (F15)."
  recovery_on_session_start:
    - {
        found: "intent only",
        leaf_after_restart: "source tip (F7, F10)",
        action: "Mark stale. Notify the user. Do nothing until /handoff resume <id>.",
      }
    - {
        found: "destination, no continuation with matching details.handoffId",
        leaf_after_restart: "destination",
        action: "Send the continuation once.",
      }
    - {
        found: "destination and continuation",
        leaf_after_restart: "continuation or later",
        action: "Nothing.",
      }
    - {
        found: "cancel record",
        leaf_after_restart: "source branch",
        action: "Nothing.",
      }
    - {
        found: "non-handoff entries under the anchor before the destination",
        leaf_after_restart: "under the anchor",
        action: "Report. No automatic repair. Search marks them orphaned.",
      }
  idempotence_rule: "Derive the state from records by handoffId each time. Running the reconciler twice must append nothing the second time."
  queued_input: "While the flag is set, an input handler returns { action: 'handled' } and keeps the text. Replay it with pi.sendUserMessage(text, { deliverAs: 'followUp' }) after step 7 (A2)."
  uncertain_tool_effects: "The intent lists every tool call since the last user message on the source branch with status completed, error or no-result. The continuation names unfinished ones."
  compaction_policy:
    - "session_before_compact with reason threshold: return { cancel: true } and notify the user to run /handoff (A3)."
    - "reason overflow: allow it, because cancelling would stall the turn. Append a CompactionAllowedRecord."
    - "reason manual: allow it and append a CompactionAllowedRecord."

execution_constraints:
  - "Run every command from ~/src/pi-handoff."
  - "Use npm. Add packages only with `npm install`. Ask the user before adding any package other than those listed in repository."
  - "Never add test files, test frameworks or mocks."
  - "Run demos with an isolated agent dir and session dir: PI_CODING_AGENT_DIR=$PWD/.demo/agent, --session-dir $PWD/.demo/sessions. Keep .demo/ out of git."
  - "Load the extension only with `pi -e ./src/extension.ts`. Do not run `pi install`."
  - "Commit after each step that passes its check. Let lefthook run. Never pass --no-verify."
  - "Keep comments only for a non-obvious why."

commands:
  install: npm install
  lint_and_format_check: npm run check
  autofix: npm run fix
  doctor: npx ultracite doctor
  typecheck: "npx tsc --noEmit -p . (typescript is not installed; ask before adding it, or rely on oxlint type-aware via `npm run check`)"
  load_smoke: 'PI_CODING_AGENT_DIR=$PWD/.demo/agent pi -e ./src/extension.ts --session-dir $PWD/.demo/sessions -p "say ok"'
  inspect_session: "jq -c '{type, id, parentId, customType}' .demo/sessions/*.jsonl"
  provider_capture: "A before_provider_request handler, enabled only when PI_HANDOFF_CAPTURE=<dir>, writes each payload to <dir>/<n>.json."

steps:
  - id: 1
    name: Load the extension
    actions:
      - "Add .demo/ to .gitignore."
      - "Create src/extension.ts that registers nothing but a session_start handler which calls ctx.ui.notify('pi-handoff loaded')."
    done_when:
      - "load_smoke exits 0 and prints model output."
      - "npm run check exits 0."
  - id: 2
    name: Records
    actions:
      - "Create src/records.ts from contracts.records_ts with compiled validators for every record."
    done_when:
      - "npm run check exits 0."
      - "A one-off `node probe.ts` run (not committed) shows check() true for a valid DestinationRecord and the expected errors() for a bad one, matching F30."
  - id: 3
    name: Anchor
    actions:
      - "On session_start (startup|new) append AnchorRecord when none exists."
    done_when:
      - "After load_smoke, the first custom entry in the new session JSONL has customType pi-handoff/anchor and appears before the first assistant message."
      - "A second run with --session <same file> adds no second anchor."
  - id: 4
    name: Intent, command and tool
    actions:
      - "Create src/handoff.ts with the handoff tool, /handoff, /handoff resume and the agent_settled dispatch (lifecycle steps 1 and 2)."
    done_when:
      - "Asking the model to call handoff produces one pi-handoff/intent entry on the source branch, and agent_settled dispatches /pi-handoff:run."
  - id: 5
    name: Navigation, destination and continuation
    actions:
      - "Implement lifecycle steps 3 to 7 and src/continuation.ts from contracts.continuation_template."
      - "Implement PI_HANDOFF_PAUSE_AT for D1 and D2 (A5)."
    done_when:
      - "Demo D3 passes."
  - id: 6
    name: Recovery
    actions:
      - "Create src/reconcile.ts implementing recovery_on_session_start and idempotence_rule."
    done_when:
      - "Demos D1 and D2 pass."
  - id: 7
    name: Queued input and cancellation
    actions:
      - "Add the input handler and CancelRecord paths."
    done_when:
      - "Demos D4 and D5 pass."
  - id: 8
    name: Compaction policy
    actions:
      - "Add the session_before_compact handler."
    done_when:
      - "Demo D6 passes."
  - id: 9
    name: Retrieval
    actions:
      - "Create src/search.ts with handoff_search per contracts."
    done_when:
      - "Demo D7 passes."

required_verification:
  artifacts_dir: ".demo/artifacts/<demo-id>/ containing the session JSONL, provider captures and a pass.txt with the commands run and their output"
  demos:
    D1:
      {
        setup: "Start a handoff with PI_HANDOFF_PAUSE_AT=after-navigate, kill pi while it waits, restart with --session <file>.",
        pass: "JSONL line count is unchanged by navigation. Leaf after restart is the source tip. The reconciler reports a stale intent and sends nothing.",
      }
    D2:
      {
        setup: "PI_HANDOFF_PAUSE_AT=after-destination, kill, restart twice.",
        pass: "The last line before restart is the destination with parentId == anchor id. The first restart appends exactly one continuation. The second restart appends nothing.",
      }
    D3:
      {
        setup: "Complete a handoff with PI_HANDOFF_CAPTURE set, then send one message.",
        pass: "The captured payload has the system prompt, the prefix up to the anchor, the continuation and the new message, and no text unique to the archived work.",
      }
    D4:
      {
        setup: "In archived work, have a tool write .demo/effect.txt. Hand off.",
        pass: "The file still exists with the same content. The continuation lists any unfinished tool calls.",
      }
    D5:
      {
        setup: "In the TUI, type a message while PI_HANDOFF_PAUSE_AT holds the handoff.",
        pass: "The typed message appears in the JSONL after the continuation, never directly under the anchor.",
      }
    D6:
      {
        setup: "Set compaction.reserveTokens high in .demo/agent/settings.json so the threshold trips quickly.",
        pass: "No compaction entry appears for a threshold trigger, and the user is told to hand off.",
      }
    D7:
      {
        setup: "Create archived work A, an abandoned alternative under it, then hand off twice. Search for text from each.",
        pass: "Each hit has the right status and carries sessionFile, sessionId and entryId.",
      }

blockers: []

human_decisions:
  H1:
    {
      question: "Approve or edit contracts.continuation_template.content.",
      answer: "Approved as written on 2026-11-06.",
      blocks: "nothing",
    }
  H2:
    {
      question: "Cancel threshold compaction (current plan) or tell users to set compaction.enabled false, which also disables overflow recovery.",
      answer: "Cancel threshold compaction only. Approved on 2026-11-06.",
      blocks: "nothing",
    }
  H3:
    {
      question: "Plain substring search, or a ranking library (needs approval to add a package).",
      answer: "Plain case-insensitive substring search. Approved on 2026-11-06.",
      blocks: "nothing",
    }
  H4:
    {
      question: "Who starts a handoff: the model tool, the user command, or both.",
      answer: "Both the model tool and the /handoff command. Approved on 2026-11-06.",
      blocks: "nothing",
    }

report_back:
  - "Commit hashes per step, with `git log --oneline`."
  - "For each step, its done_when results with the command output."
  - "For each demo D1 to D7: pass, fail, or could not run, with the artifacts path. Could not run is not a pass."
  - "Each assumption A1 to A6: confirmed or refuted, with evidence."
  - "Any established fact the code contradicted, with the source line you read."
  - "Any place where the code could not follow the answers to H1 to H4, and why."
  - "Final `npm run check` and `git status --porcelain` output."
